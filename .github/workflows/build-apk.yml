name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.0'
        channel: 'stable'
        
    - name: Get dependencies
      run: flutter pub get
    
    - name: Regenerate Android Files
      # This deletes my manual files and lets Flutter create fresh, valid ones
      run: |
        rm -rf android
        flutter create --platforms android .

    - name: Build APK (Debug) with Logging
      run: flutter build apk --debug > build_log.txt 2>&1 || true
      
    - name: Upload Build Log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-logs
        path: build_log.txt
      

      
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: pediatric-growth-monitor-apk
        path: build/app/outputs/flutter-apk/app-debug.apk
        retention-days: 30
